name: Offline SQLite and API checks
on:
  push:
  pull_request:
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Verify frontend JavaScript syntax
        run: node --check schemaguard/static/app.js
      - name: Deterministic SQL and mock-only graph unit tests (NOT real FalkorDB/LLM)
        run: python -m pytest -q
